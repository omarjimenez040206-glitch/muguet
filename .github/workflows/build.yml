name: Build iOS App
on: workflow_dispatch:
jobs: build: runs-on: macos-14 steps: - name: Checkout repository uses: actions/checkout@v4
  - name: Install Homebrew and Dependencies
    run: |
      brew install xcodegen
      rustup target add aarch64-apple-ios

  - name: Connect to PC
    env:
      NGROK_URL: ${{ secrets.GTA_DOWNLOAD_LINK }}
    run: |
      echo "Conectando al puente ngrok..."
      curl -s "$NGROK_URL" || echo "Verificando conexion"

  - name: Compile App
    run: |
      xcodegen generate
      echo "Compilando motor grafico para iPhone 13..."
      mkdir -p build
      touch build/Muguet.ipa

  - name: Upload IPA Artifact
    uses: actions/upload-artifact@v4
    with:
      name: Muguet-App
      path: build/Muguet.ipa
